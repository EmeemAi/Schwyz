                                    Tocá los instrumentos que tenés en tu empresa para sumarlos al carrito con <strong>10% OFF</strong>.
                                </p>
                            </div>

                            {/* Pestañas de Modo: Selección Rápida | Buscar en Catálogo | Escribir a mano */}
                            <div className="grid grid-cols-3 gap-1 bg-black/40 p-1 rounded-xl mb-4 border border-white/10 text-xs">
                                <button
                                    onClick={() => setViewMode('quick')}
                                    className={`py-2 px-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${
                                        viewMode === 'quick' 
                                            ? 'bg-[#FFC700] text-[#002654] shadow' 
                                            : 'text-gray-300 hover:text-white'
                                    }`}
                                >
                                    <Icon name="zap" size={14} />
                                    <span>Rápido</span>
                                </button>
                                <button
                                    onClick={() => setViewMode('search')}
                                    className={`py-2 px-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${
                                        viewMode === 'search' 
                                            ? 'bg-[#FFC700] text-[#002654] shadow' 
                                            : 'text-gray-300 hover:text-white'
                                    }`}
                                >
                                    <Icon name="search" size={14} />
                                    <span>Buscar</span>
                                </button>
                                <button
                                    onClick={() => setViewMode('text')}
                                    className={`py-2 px-2 rounded-lg font-bold transition-all flex items-center justify-center gap-1.5 ${
                                        viewMode === 'text' 
                                            ? 'bg-[#FFC700] text-[#002654] shadow' 
                                            : 'text-gray-300 hover:text-white'
                                    }`}
                                >
                                    <Icon name="pen-tool" size={14} />
                                    <span>Escribir</span>
                                </button>
                            </div>

                            {/* MODO 1: SELECCIÓN RÁPIDA (TOUCH Y LISTO) */}
                            {viewMode === 'quick' && (
                                <div className="space-y-4 animate-fadeIn">
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                                        {QUICK_INSTRUMENTS.map(item => {
                                            const qty = selectedItems[item.code]?.qty || 0;
                                            const isSelected = qty > 0;

                                            return (
                                                <div 
                                                    key={item.code}
                                                    onClick={() => !isSelected && updateItemQty(item.code, item.name, 1)}
                                                    className={`p-3 rounded-2xl border transition-all duration-200 select-none flex flex-col justify-between relative cursor-pointer min-h-[95px] ${
                                                        isSelected 
                                                            ? 'bg-gradient-to-b from-[#002654] to-[#0a1e36] border-[#FFC700] shadow-md shadow-[#FFC700]/20' 
                                                            : 'bg-white/5 border-white/10 hover:bg-white/10 hover:border-white/20 active:scale-95'
                                                    }`}
                                                >
                                                    <div className="flex items-center justify-between mb-1">
                                                        <div className={`p-1.5 rounded-lg ${isSelected ? 'bg-[#FFC700] text-[#002654]' : 'bg-white/10 text-gray-300'}`}>
                                                            <Icon name={item.icon} size={16} />
                                                        </div>
                                                        {isSelected && (
                                                            <span className="text-[10px] font-black bg-[#FFC700] text-[#002654] px-1.5 py-0.2 rounded-full">
                                                                {qty}
                                                            </span>
                                                        )}
                                                    </div>

                                                    <div className="text-xs font-bold text-white leading-tight mb-2">
                                                        {item.name}
                                                    </div>

                                                    {/* Controles de cantidad cuando está seleccionado */}
                                                    {isSelected ? (
                                                        <div className="flex items-center justify-between bg-black/40 rounded-xl p-0.5 border border-[#FFC700]/40" onClick={e => e.stopPropagation()}>
                                                            <button 
                                                                onClick={() => updateItemQty(item.code, item.name, -1)}
                                                                className="w-7 h-7 flex items-center justify-center text-[#FFC700] hover:bg-white/10 rounded-lg active:scale-90"
                                                            >
                                                                <Icon name="minus" size={13} />
                                                            </button>
                                                            <span className="text-xs font-bold text-white px-1">
                                                                {qty}
                                                            </span>
                                                            <button 
                                                                onClick={() => updateItemQty(item.code, item.name, 1)}
                                                                className="w-7 h-7 flex items-center justify-center text-[#FFC700] hover:bg-white/10 rounded-lg active:scale-90"
                                                            >
                                                                <Icon name="plus" size={13} />
                                                            </button>
                                                        </div>
                                                    ) : (
                                                        <div className="text-[11px] font-semibold text-[#FFC700]/70 flex items-center gap-1">
                                                            <span>+ Tocar para sumar</span>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <p className="text-[11px] text-gray-400 text-center pt-1">
                                        ¿Buscás otro equipo? Usá la pestaña <strong>Buscar</strong> o <strong>Escribir</strong> arriba.
                                    </p>
                                </div>
                            )}

                            {/* MODO 2: BUSCADOR EN EL CATÁLOGO COMPLETO (109 EQUIPOS) */}
                            {viewMode === 'search' && (
                                <div className="space-y-3 animate-fadeIn">
                                    <div className="relative">
                                        <div className="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">
                                            <Icon name="search" size={16} />
                                        </div>
                                        <input 
                                            type="text" 
                                            autoFocus
                                            value={searchTerm}
                                            onChange={e => setSearchTerm(e.target.value)}
                                            placeholder="Escribe el equipo (ej: calibre, manómetro, tacómetro, luxómetro)..."
                                            className="w-full bg-black/40 border border-white/20 rounded-xl pl-9 pr-9 py-3 text-xs sm:text-sm text-white focus:outline-none focus:border-[#FFC700]"
                                        />
                                        {searchTerm && (
                                            <button onClick={() => setSearchTerm('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 p-1">
                                                <Icon name="x" size={14} />
                                            </button>
                                        )}
                                    </div>

                                    {searchTerm.trim() ? (
                                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                            {catalogResults.map(item => {
                                                const qty = selectedItems[item.code]?.qty || 0;
                                                const isSelected = qty > 0;

                                                return (
                                                    <div key={item.code} className="flex items-center justify-between p-2.5 rounded-xl bg-white/5 border border-white/10 text-xs">
                                                        <div className="flex-1 pr-2">
                                                            <div className="font-semibold text-white leading-tight">{item.name}</div>
                                                            <div className="text-[10px] text-gray-400">{item.code} • {item.category}</div>
                                                        </div>

                                                        {isSelected ? (
                                                            <div className="flex items-center bg-[#002654] border border-[#FFC700] rounded-lg">
                                                                <button onClick={() => updateItemQty(item.code, item.name, -1)} className="px-2 py-1 text-[#FFC700]">-</button>
                                                                <span className="px-2 font-bold text-white">{qty}</span>
                                                                <button onClick={() => updateItemQty(item.code, item.name, 1)} className="px-2 py-1 text-[#FFC700]">+</button>
                                                            </div>
                                                        ) : (
                                                            <button 
                                                                onClick={() => updateItemQty(item.code, item.name, 1)}
                                                                className="px-3 py-1.5 bg-[#FFC700] text-[#002654] rounded-lg font-bold text-[11px]"
                                                            >
                                                                + Agregar
                                                            </button>
                                                        )}
                                                    </div>
                                                );
                                            })}

                                            {catalogResults.length === 0 && (
                                                <div className="text-center py-6 text-xs text-gray-400">
                                                    No encontramos ese equipo exacto. Podés usar la pestaña <strong>Escribir</strong> para ponerlo libremente.
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <p className="text-xs text-gray-400 text-center py-4">
                                            Escribe una palabra clave para buscar entre los 109 instrumentos que calibramos.
                                        </p>
                                    )}
                                </div>
                            )}

                            {/* MODO 3: ESCRIBIR LA LISTA A MANO (CERO FRICCIÓN) */}
                            {viewMode === 'text' && (
                                <div className="space-y-3 animate-fadeIn">
                                    <div className="bg-white/5 border border-white/10 rounded-2xl p-4">
                                        <label className="block text-xs font-bold text-gray-300 mb-1.5">
                                            Escribí tus equipos como te sea más cómodo:
                                        </label>
                                        <textarea 
                                            rows={4}
                                            value={freeTextList}
                                            onChange={e => setFreeTextList(e.target.value)}
                                            placeholder="Ej: Tengo 3 calibres de 200mm, 2 manómetros de 10 bar y 1 termohigrómetro digital..."
                                            className="w-full bg-black/40 border border-white/15 rounded-xl p-3 text-xs sm:text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#FFC700]"
                                        ></textarea>
                                        <p className="text-[11px] text-gray-400 mt-2">
                                            📌 No te preocupes por códigos ni marcas exactas. Nuestro laboratorio lo revisa y te arma el presupuesto.
                                        </p>
                                    </div>
                                </div>
                            )}

                            {/* RESUMEN DEL CARRITO (Si hay algo seleccionado) */}
                            {totalEquipos > 0 && (
                                <div className="mt-5 p-3.5 rounded-2xl bg-black/30 border border-[#FFC700]/30 animate-fadeIn">
                                    <div className="flex items-center justify-between text-xs font-bold text-[#FFC700] mb-2">
                                        <span className="flex items-center gap-1.5">
                                            <Icon name="shopping-bag" size={15} />
                                            Tu Selección ({totalEquipos} {totalEquipos === 1 ? 'equipo' : 'equipos'}):
                                        </span>
                                        <span className="text-[10px] bg-[#FFC700]/20 text-[#FFC700] px-2 py-0.5 rounded">
                                            10% OFF Incluido
                                        </span>
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {Object.values(selectedItems).map(item => (
                                            <span key={item.code} className="inline-flex items-center gap-1.5 bg-white/10 border border-white/10 text-white text-xs px-2.5 py-1 rounded-lg">
                                                <strong>{item.qty}x</strong> {item.name}
                                                <button onClick={() => updateItemQty(item.code, item.name, -item.qty)} className="text-gray-400 hover:text-red-400 ml-1">
                                                    ×
                                                </button>
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            )}


                            {/* BARRA FIJA INFERIOR (CTA DE ENVÍO DIRECTO) */}
                            <div className="fixed bottom-0 left-0 right-0 p-3.5 bg-[#001a3d]/95 backdrop-blur-lg border-t border-white/10 z-50 shadow-2xl">
                                <div className="max-w-xl mx-auto flex items-center justify-between gap-3">
                                    <div>
                                        <div className="text-xs font-extrabold text-white flex items-center gap-1.5">
                                            <span>{totalEquipos > 0 ? `${totalEquipos} equipo(s)` : (freeTextList.trim() ? 'Lista libre' : '0 seleccionados')}</span>
                                            <span className="bg-[#FFC700] text-[#002654] text-[10px] font-black px-1.5 py-0.2 rounded">10% OFF</span>
                                        </div>
                                        <div className="text-[10px] text-gray-400">Sin compromiso</div>
                                    </div>

                                    <button 
                                        onClick={handleSubmitQuote}
                                        disabled={isSubmitting || (totalEquipos === 0 && !freeTextList.trim())}
                                        className="flex-1 bg-[#FFC700] hover:bg-[#ffdb4d] text-[#002654] font-black py-3.5 px-5 rounded-xl transition-all transform active:scale-95 flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed shadow-lg shadow-[#FFC700]/25 text-sm"
                                    >
                                        {isSubmitting ? (
                                            <>
                                                <Icon name="loader-2" className="animate-spin w-4 h-4" />
                                                <span>Enviando pedido...</span>
                                            </>
                                        ) : (
                                            <>
                                                <Icon name="send" size={16} />
                                                <span>Pedir Presupuesto con 10% OFF</span>
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </>
                    ) : (
                        /* PANTALLA DE ÉXITO ULTRA LIMPIA */
                        <div className="bg-white/5 border border-white/10 rounded-3xl p-6 text-center backdrop-blur-xl animate-fadeIn shadow-2xl mt-4">
                            <div className="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-[0_0_25px_rgba(34,197,94,0.4)]">
                                <Icon name="check-circle" size={32} className="text-white" />
                            </div>

                            <h2 className="text-xl sm:text-2xl font-black text-white mb-1.5">
                                ¡Pedido de Presupuesto Enviado!
                            </h2>
                            <p className="text-xs text-gray-300 max-w-sm mx-auto mb-6 leading-relaxed">
                                Recibimos tu solicitud con el <strong>10% OFF</strong>. Nuestro laboratorio técnico preparará la cotización y te la enviará a la brevedad.
                            </p>

                            <div className="flex flex-col gap-2.5 max-w-xs mx-auto">
                                <a 
                                    href="index.html"
                                    className="w-full bg-white/10 hover:bg-white/20 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center transition-all text-xs no-underline"
                                >
                                    Volver al Inicio
                                </a>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PresupuestoApp />);
    </script>
</body>
</html>
