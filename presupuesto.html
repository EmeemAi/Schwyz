                                        </div>
                                        <div>
                                            <h3 className="text-sm sm:text-base font-bold text-white leading-tight">
                                                Agregar Equipo Manualmente
                                            </h3>
                                            <p className="text-[11px] text-gray-400">
                                                Instrumento fuera del catálogo estándar
                                            </p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setShowCustomModal(false)}
                                        className="p-1.5 rounded-full text-gray-400 hover:text-white hover:bg-white/10"
                                    >
                                        <Icon name="x" size={18} />
                                    </button>
                                </div>

                                <form onSubmit={handleAddCustomItem} className="space-y-3.5">
                                    <div>
                                        <label className="text-xs font-bold text-gray-300 block mb-1">
                                            Instrumento, Modelo o Rango *
                                        </label>
                                        <input 
                                            type="text" 
                                            required 
                                            autoFocus
                                            value={customName}
                                            onChange={e => setCustomName(e.target.value)}
                                            placeholder="Ej: Durómetro de banco, Calibrador especial, etc."
                                            className="w-full bg-black/40 border border-white/20 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white focus:outline-none focus:border-[#FFC700]"
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-gray-300 block mb-1">
                                            Cantidad de unidades
                                        </label>
                                        <div className="flex items-center gap-3">
                                            <div className="flex items-center bg-black/40 rounded-xl p-1 border border-white/15">
                                                <button 
                                                    type="button"
                                                    onClick={() => setCustomQty(prev => Math.max(1, prev - 1))}
                                                    className="w-8 h-8 flex items-center justify-center text-[#FFC700] hover:bg-white/10 rounded-lg active:scale-90"
                                                >
                                                    <Icon name="minus" size={14} />
                                                </button>
                                                <span className="text-xs font-bold text-white px-3">
                                                    {customQty}
                                                </span>
                                                <button 
                                                    type="button"
                                                    onClick={() => setCustomQty(prev => prev + 1)}
                                                    className="w-8 h-8 flex items-center justify-center text-[#FFC700] hover:bg-white/10 rounded-lg active:scale-90"
                                                >
                                                    <Icon name="plus" size={14} />
                                                </button>
                                            </div>
                                            <span className="text-[11px] text-gray-400">unidad(es) a cotizar</span>
                                        </div>
                                    </div>

                                    <div className="flex justify-end gap-2 pt-2 border-t border-white/10">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowCustomModal(false)}
                                            className="px-4 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-5 py-2.5 rounded-xl text-xs font-bold bg-[#FFC700] hover:bg-[#ffdb4d] text-[#002654] transition-all shadow"
                                        >
                                            Agregar a mi Pedido
                                        </button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PresupuestoApp />);
    </script>
</body>
</html>
